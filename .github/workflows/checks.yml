name: Package checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-demo.txt
      - run: python -B -m unittest discover -s tests -v
      - run: python -B scripts/verify_package.py
      - run: python scripts/pipeline.py doctor
      - run: python scripts/pipeline.py validate examples/antigen_escape/project.json
      - name: Build, decode, check captions and evidence, and verify selective rebuilding
        run: python scripts/smoke_check.py --output-dir outputs/ci-smoke
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Xingzhenqiu/paper-to-video-skill'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-v0.2.1-alpha
      cancel-in-progress: false
    env:
      RELEASE_TAG: v0.2.1-alpha
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the public media verification dependencies
        run: python -m pip install -r requirements-demo.txt
      - name: Check whether this release already exists
        id: release_state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags.txt"
          if grep -Fxq "$RELEASE_TAG" "$RUNNER_TEMP/release-tags.txt"; then
            echo "Release $RELEASE_TAG already exists; leaving its tag and assets unchanged."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            tag_count=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" --jq '[.[] | select(.ref == "refs/tags/v0.2.1-alpha")] | length')
            if [ "$tag_count" != "0" ]; then
              echo "::error::Tag $RELEASE_TAG already exists without a release; refusing to publish an unchecked target."
              exit 1
            fi
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Package and verify both public downloads
        if: steps.release_state.outputs.exists == 'false'
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import struct
          import subprocess
          import zipfile
          import imageio_ffmpeg

          root = Path.cwd()
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8').split('\0')
          tracked = sorted(path for path in tracked if path)
          if not {'LICENSE', 'RELEASE_MANIFEST.json', 'skills/paper-to-video/SKILL.md'}.issubset(tracked):
              raise SystemExit('License, manifest, and skill entry point must all be tracked')
          manifest_data = (root / 'RELEASE_MANIFEST.json').read_bytes()
          manifest = json.loads(manifest_data)
          if manifest['version'] != '0.2.1-alpha' or manifest['manifest_hash_excludes_itself'] is not True:
              raise SystemExit('Unexpected release manifest version or self-hash policy')
          entries = {entry['path']: entry for entry in manifest['files']}
          expected = set(tracked) - {'RELEASE_MANIFEST.json'}
          if len(entries) != len(manifest['files']) or set(entries) != expected:
              raise SystemExit('Manifest must exactly match tracked release files, excluding itself')
          if manifest['source_file_count'] != len(entries):
              raise SystemExit('Manifest file count differs from its entries')
          files = {}
          for relative in tracked:
              path = root / relative
              if not path.resolve().is_relative_to(root) or path.is_symlink() or not path.is_file():
                  raise SystemExit('Unsupported tracked release file: ' + relative)
              data = path.read_bytes()
              if relative != 'RELEASE_MANIFEST.json':
                  entry = entries[relative]
                  if entry['size'] != len(data) or entry['sha256'] != hashlib.sha256(data).hexdigest():
                      raise SystemExit('Manifest hash or size mismatch: ' + relative)
              files[relative] = data
          if not files['LICENSE'].decode('utf-8').startswith('MIT License'):
              raise SystemExit('The reviewed MIT LICENSE is required')

          # Public downloads contain code and silent demonstrations only.
          audio_suffixes = {
              '.wav', '.wave', '.mp3', '.mp2', '.flac', '.ogg', '.oga', '.opus',
              '.m4a', '.m4b', '.m4p', '.aac', '.adts', '.wma', '.aif', '.aiff',
              '.aifc', '.amr', '.au', '.snd', '.caf', '.ac3', '.dts', '.mka',
              '.weba', '.pcm', '.ape', '.alac',
          }
          video_suffixes = {'.mp4', '.m4v', '.mov', '.mkv', '.webm', '.avi', '.mpeg', '.mpg'}
          ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()
          for relative in tracked:
              suffix = Path(relative).suffix.lower()
              if suffix in audio_suffixes:
                  raise SystemExit('Voice/audio files are excluded from this public release: ' + relative)
              if suffix not in video_suffixes:
                  continue
              path = str(root / relative)
              video = subprocess.run([ffmpeg, '-hide_banner', '-v', 'error', '-nostdin', '-i', path, '-map', '0:v:0', '-an', '-f', 'null', '-'], capture_output=True)
              if video.returncode:
                  raise SystemExit('Public video failed full decode: ' + relative)
              sound = subprocess.run([ffmpeg, '-hide_banner', '-v', 'error', '-nostdin', '-i', path, '-map', '0:a', '-vn', '-c:a', 'pcm_f64le', '-f', 'f64le', 'pipe:1'], capture_output=True)
              if sound.returncode:
                  if 'matches no streams' not in sound.stderr.decode('utf-8', errors='replace'):
                      raise SystemExit('Cannot verify every public audio stream: ' + relative)
              elif len(sound.stdout) % 8 or any(sample[0] != 0.0 for sample in struct.iter_unpack('<d', sound.stdout)):
                  raise SystemExit('Voiced or nonzero audio is excluded from public videos: ' + relative)
              print(relative, 'fully decoded; silent')

          skill_prefix = 'skills/paper-to-video/'
          standalone = {relative[len(skill_prefix):]: data for relative, data in files.items() if relative.startswith(skill_prefix)}
          if 'SKILL.md' not in standalone:
              raise SystemExit('The standalone skill entry point is missing')
          standalone['LICENSE'] = files['LICENSE']
          standalone_manifest = {
              **manifest,
              'package': 'standalone-skill',
              'source_manifest_sha256': hashlib.sha256(manifest_data).hexdigest(),
              'source_file_count': len(standalone),
              'files': [
                  {'path': relative, 'size': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
                  for relative, data in sorted(standalone.items())
              ],
          }
          standalone['RELEASE_MANIFEST.json'] = (json.dumps(standalone_manifest, indent=2) + '\n').encode('utf-8')
          dist = root / 'dist'
          dist.mkdir(exist_ok=True)
          downloads = [
              (dist / 'paper-to-video-skill-v0.2.1-alpha.zip', 'paper-to-video-skill', files),
              (dist / 'paper-to-video-standalone-v0.2.1-alpha.zip', 'paper-to-video', standalone),
          ]
          for destination, prefix, members in downloads:
              with zipfile.ZipFile(destination, 'w', zipfile.ZIP_DEFLATED) as archive:
                  for relative, data in sorted(members.items()):
                      archive.writestr(prefix + '/' + relative, data)
              with zipfile.ZipFile(destination) as archive:
                  expected_members = {prefix + '/' + relative for relative in members}
                  if archive.testzip() is not None or set(archive.namelist()) != expected_members or len(archive.namelist()) != len(members):
                      raise SystemExit('ZIP CRC or member-set check failed: ' + destination.name)
                  for relative, data in members.items():
                      restored = archive.read(prefix + '/' + relative)
                      if len(restored) != len(data) or hashlib.sha256(restored).digest() != hashlib.sha256(data).digest():
                          raise SystemExit('ZIP payload mismatch: ' + relative)
              print(destination.name, destination.stat().st_size, 'bytes; verified')
          (dist / 'SHA256SUMS.txt').write_text(
              ''.join(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n' for path, _, _ in downloads),
              encoding='ascii',
          )
          PY
      - name: Create the new prerelease without replacing previous releases
        if: steps.release_state.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          v0.2.1-alpha fixes first-run portability for the reviewed-plan renderer.

          Windows Git checkouts now preserve the exact tracked bytes used by source and manifest hashes, including retained reports. CJK scenes without an explicitly configured font fail early with setup guidance instead of silently rendering missing characters. The default dependencies are pinned, and doctor reports the documented Python 3.12 runtime.

          Bilingual quick starts use an isolated environment without requiring shell activation. A new smoke_check command builds the real silent case, fully decodes its video and audio, checks captions and evidence, verifies unchanged cache payloads, then changes one title to verify selective rebuilding. It works on a copy and preserves the supplied example.

          This release job waits for the current unit suite, package/source checks and real smoke check on Windows, Linux and macOS with Python 3.12. A passing run verifies these recorded environments and the included example, not every machine or arbitrary paper.

          Public downloads contain MIT code and silent demonstrations only. The full and standalone ZIPs include LICENSE and package-specific manifests; SHA256SUMS.txt verifies the downloads. Third-party paper assets retain the terms in RIGHTS.md. No speech files, private voices, credentials or private papers are included.

          Agent-authored content and scientific structures still need human review. Raw PDF/OCR, arbitrary scientific components, other Python versions and untested language/font combinations are outside this tested path. Local speech remains separately configured and requires listening review.

          Previous releases and their assets remain unchanged.
          NOTES
          gh release create "$RELEASE_TAG" \
            dist/paper-to-video-skill-v0.2.1-alpha.zip \
            dist/paper-to-video-standalone-v0.2.1-alpha.zip \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "v0.2.1-alpha: reliable first run across Windows, Linux and macOS" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease --latest=false
          released_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          if [ "$released_sha" != "$RELEASE_SHA" ]; then
            echo "::error::Published tag does not resolve to the tested commit."
            exit 1
          fi
